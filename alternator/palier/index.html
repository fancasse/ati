<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alternator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #1a1a1a; line-height: 1.8; }
.container { max-width: 800px; margin: 0 auto; padding: 16px; }

.header { background: #1a73e8; color: #fff; padding: 24px 16px; text-align: center; border-radius: 12px; margin-bottom: 16px; }
.header h1 { font-size: 1.5rem; }
.header p { font-size: 0.95rem; opacity: 0.9; margin-top: 6px; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
.tab { flex-shrink: 0; background: #fff; border: 2px solid #e0e0e0; border-radius: 24px; padding: 8px 16px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
.tab.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }

.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); animation: fadeIn 0.4s ease; }
.card h2 { color: #1a73e8; font-size: 1.2rem; margin-bottom: 12px; border-bottom: 2px solid #e8f0fe; padding-bottom: 8px; }
.card img { width: 100%; height: auto; border-radius: 10px; margin: 12px 0; display: block; }
.card p { margin-bottom: 12px; font-size: 1rem; }
.card ul { padding-right: 20px; margin-bottom: 12px; }
.card li { margin-bottom: 6px; }

.tip { background: #e8f0fe; border-right: 4px solid #1a73e8; padding: 12px; border-radius: 8px; margin: 12px 0; }
.tip strong { color: #1a73e8; }

.error { background: #fce8e6; color: #c5221f; padding: 16px; border-radius: 10px; text-align: center; margin-bottom: 16px; }

.footer { text-align: center; padding: 20px; color: #666; font-size: 0.85rem; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 480px) {
  .container { padding: 10px; }
  .header h1 { font-size: 1.25rem; }
  .card { padding: 16px; }
  .card h2 { font-size: 1.1rem; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 id="siteTitle">دروس وواجبات</h1>
    <p id="siteSubtitle">تعلم ببساطة</p>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <div class="footer">
    <p>© 2026 دروس وواجبات</p>
  </div>
</div>

<script>
// ==========================================
// استبدل هذا الرابط برابط GitHub Raw الخاص بك
// ==========================================
const JSON_URL = 'https://raw.githubusercontent.com/fancasse/ati/refs/heads/main/alternator/palier/lessons.json';
// مثال: https://raw.githubusercontent.com/ahmed/dross/main/lessons.json

(async function() {
  let data;
  try {
    data = await fetch(JSON_URL).then(r => {
      if (!r.ok) throw new Error('فشل في جلب البيانات');
      return r.json();
    });
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="error">
        ⚠️ لم يتم جلب ملف JSON من GitHub.<br>
        تأكد من وضع الرابط الصحيح في متغير JSON_URL في الكود.<br>
        <small style="opacity:0.7">${e.message}</small>
      </div>`;
    return;
  }

  document.getElementById('siteTitle').textContent = data.site.title;
  document.getElementById('siteSubtitle').textContent = data.site.subtitle;

  const tabs = document.getElementById('tabs');
  const content = document.getElementById('content');
  let activeLesson = 0;

  function render() {
    content.innerHTML = '';
    const lesson = data.lessons[activeLesson];

    lesson.sections.forEach(sec => {
      const card = document.createElement('div');
      card.className = 'card';

      let html = '';

      if (sec.type === 'intro') {
        html += `<h2>${lesson.icon} ${lesson.title}</h2>`;
        if (sec.image) html += `<img src="${sec.image}" alt="${lesson.title}">`;
        html += `<p>${sec.text}</p>`;
      } else {
        html += `<h2>${sec.icon || ''} ${sec.title || ''}</h2>`;
        if (sec.image) html += `<img src="${sec.image}" alt="${sec.title}">`;
        if (sec.text) html += `<p>${sec.text}</p>`;
        if (sec.list) {
          html += '<ul>' + sec.list.map(i => `<li>${i}</li>`).join('') + '</ul>';
        }
        if (sec.tip) {
          html += `<div class="tip"><strong>💡 نصيحة:</strong> ${sec.tip}</div>`;
        }
      }

      card.innerHTML = html;
      content.appendChild(card);
    });
  }

  data.lessons.forEach((l, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.textContent = l.title;
    btn.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      activeLesson = i;
      render();
    };
    tabs.appendChild(btn);
  });

  render();
})();
</script>

</body>
</html>
